name: Deploy public site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build verified public artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_PUBLIC_BASE: /tourism-intelligence-desk/
      VITE_BUILD_SHA: ${{ github.sha }}
      VITE_DEPLOYMENT: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate and build
        run: bun run check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
